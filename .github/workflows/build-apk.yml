name: build debug apk

# 在自有分支上编译 XAutoDaily（debug 变体）
# 触发方式：推送到 mine/** 分支，或手动 workflow_dispatch
on:
  push:
    branches:
      - 'mine/**'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1) 先装 SDK 包：此时用 runner 自带的 JDK 17（新版 cmdline-tools 需要 17+）
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-32" \
            "build-tools;33.0.1" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "----- 已安装 -----"
          sdkmanager --list_installed

      # 2) 再切到 JDK 11：AGP 7.2.2 / Gradle 7.5.1 / Kotlin 1.6.10 的官方组合
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 环境自检
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/platforms" || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 编译 debug + release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: 列出产物
        if: always()
        run: |
          find app/build/outputs -type f -name '*.apk' -exec ls -lh {} \; || true

      - name: 上传 APK（debug + release）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XAutoDaily-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            app/build/outputs/logs/
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7
